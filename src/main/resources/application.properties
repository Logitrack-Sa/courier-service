spring.application.name=courier-service

# Configuración centralizada (Spring Cloud Config Server)
spring.config.import=optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}

# Conexión a la base de datos MySQL exclusiva de repartidores
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:courier_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:logitrack}
spring.datasource.password=${DB_PASSWORD}

# Configuración de JPA e Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC



# Configuración de Flyway para las migraciones automáticas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
logging.level.org.flywaydb=DEBUG


# Puerto oficial por contrato para courier-service
server.port=8082

# Exponer endpoints de salud
management.endpoints.web.exposure.include=health,info