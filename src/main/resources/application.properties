spring.application.name=courier-service
server.port=${SERVER_PORT:8082}
logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
logitrack.security.key-id=${JWT_KEY_ID:logitrack-main}
logitrack.security.issuer=${JWT_ISSUER:https://security-service}
logitrack.security.audience=${JWT_AUDIENCE:courier-service}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-stacktrace=never
server.address=${SERVER_ADDRESS:127.0.0.1}

logitrack.messaging.shipment-status.enabled=${SHIPMENT_STATUS_CONSUMER_ENABLED:true}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${SHIPMENT_STATUS_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${SHIPMENT_STATUS_RETRY_INITIAL_INTERVAL:500ms}
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5s

spring.profiles.default=dev

# El perfil discovery habilita el registro en Eureka.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_LISTENER_AUTO_STARTUP:true}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.timeout=1000ms
spring.data.redis.connect-timeout=2000ms
