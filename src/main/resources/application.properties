spring.application.name=courier-service
server.port=${SERVER_PORT:8082}
logitrack.security.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
logitrack.security.key-id=${JWT_KEY_ID:logitrack-main}
logitrack.security.issuer=${JWT_ISSUER:https://security-service}
logitrack.security.audience=${JWT_AUDIENCE:courier-service}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/{vendor}
spring.jackson.deserialization.fail-on-unknown-properties=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
server.error.include-message=never
server.error.include-stacktrace=never
server.address=${SERVER_ADDRESS:127.0.0.1}

spring.profiles.default=dev

# El perfil central sprint3 activa el registro; Sprint 2 conserva su arranque.
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}

# RabbitMQ host/port/credentials llegan de Config Server/config-repo; no se duplican aquí.
logitrack.messaging.shipment-status.enabled=${SHIPMENT_STATUS_CONSUMER_ENABLED:true}
spring.rabbitmq.listener.simple.auto-startup=${SHIPMENT_STATUS_LISTENER_AUTO_STARTUP:true}
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=${SHIPMENT_STATUS_CONCURRENCY:1}
spring.rabbitmq.listener.simple.max-concurrency=${SHIPMENT_STATUS_MAX_CONCURRENCY:1}
spring.rabbitmq.listener.simple.prefetch=${SHIPMENT_STATUS_PREFETCH:10}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=${SHIPMENT_STATUS_RETRY_MAX_ATTEMPTS:3}
spring.rabbitmq.listener.simple.retry.initial-interval=${SHIPMENT_STATUS_RETRY_INITIAL_INTERVAL:500ms}
spring.rabbitmq.listener.simple.retry.multiplier=${SHIPMENT_STATUS_RETRY_MULTIPLIER:2}
spring.rabbitmq.listener.simple.retry.max-interval=${SHIPMENT_STATUS_RETRY_MAX_INTERVAL:5s}
