spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:courier_service;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.cloud.config.enabled=false

eureka.client.enabled=false
logitrack.messaging.shipment-status.enabled=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.dynamic=false
management.health.rabbit.enabled=false
